name: ci

on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: fmt
        run: terraform -chdir=terraform/modules/cluster fmt -check -recursive && terraform -chdir=terraform/environments/dev fmt -check -recursive && terraform -chdir=terraform/environments/prod fmt -check -recursive
      - name: init dev
        run: terraform -chdir=terraform/environments/dev init -backend=false
      - name: validate dev
        run: terraform -chdir=terraform/environments/dev validate
      - name: init prod
        run: terraform -chdir=terraform/environments/prod init -backend=false
      - name: validate prod
        run: terraform -chdir=terraform/environments/prod validate

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kubeconform -strict -summary k8s/