  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.27.3"
      - name: Validate manifests (offline)
        run: |
          # This checks syntax and structure without needing a cluster
          kubectl apply --dry-run=client --validate=false -f k8s/ -n status-page