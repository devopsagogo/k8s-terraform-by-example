name: terraform

on:
  push:
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: fmt
        run: |
          terraform -chdir=terraform/modules/cluster fmt -check -recursive
          terraform -chdir=terraform/environments/dev fmt -check -recursive
          terraform -chdir=terraform/environments/prod fmt -check -recursive
      - name: init dev
        run: terraform -chdir=terraform/environments/dev init -backend=false
      - name: validate dev
        run: terraform -chdir=terraform/environments/dev validate
      - name: init prod
        run: terraform -chdir=terraform/environments/prod init -backend=false
      - name: validate prod
        run: terraform -chdir=terraform/environments/prod validate
