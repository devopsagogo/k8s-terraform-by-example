name: manifests

on:
  push:
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate k8s manifests
        run: kubeconform -strict -summary k8s/

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate helm templates
        run: helm template status-page helm/status-page | kubeconform -strict -summary

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Kind cluster
        uses: helm/kind-action@v1
      - name: Build image
        run: docker build -t status-page:local app/
      - name: Load image into Kind
        run: kind load docker-image status-page:local
      - name: Create namespace
        run: kubectl create namespace status-page
      - name: Apply manifests
        run: kubectl apply -f k8s/ -n status-page
      - name: Wait for rollout
        run: kubectl rollout status deployment/status-page -n status-page --timeout=90s
      - name: Show pods
        run: kubectl get pods -n status-page